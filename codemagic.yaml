workflows:
  ios-release:
    name: BrodaMeko iOS Release
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.brodameko.app
      vars:
        XCODE_WORKSPACE: 'ios/BrodaMekoBare.xcworkspace'
        XCODE_SCHEME: 'BrodaMekoBare'
      node: v20.11.1
      xcode: 16.3
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: CocoaPods clean install
        script: |
          ENTERED_IOS_DIR="0"
          if [ -d ios ]; then
            cd ios
            ENTERED_IOS_DIR="1"
          elif [ -f Podfile ]; then
            echo "Using current directory for iOS project"
          else
            echo "Could not find iOS directory or Podfile."
            pwd
            ls -la
            exit 1
          fi
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --verbose
          if [ "$ENTERED_IOS_DIR" = "1" ]; then
            cd ..
          fi
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS release
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "PRODUCT_BUNDLE_IDENTIFIER=com.brodameko.app" \
            --export-xcargs "PRODUCT_BUNDLE_IDENTIFIER=com.brodameko.app"
      - name: Publish to TestFlight (manual key decode)
        script: |
          set -e
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 --decode > /tmp/AuthKey.p8
          sed -i '' 's/\r$//' /tmp/AuthKey.p8 || true
          openssl pkey -in /tmp/AuthKey.p8 -noout

          app-store-connect publish \
            --path build/ios/ipa/BrodaMekoBare.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/AuthKey.p8 \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
